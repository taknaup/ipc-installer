# Settings shared by every install. Sourced by scripts/setup.sh (runs as root).
# Anything here can also be overridden from the environment.

# Gateway administrator account created for every install.
GATEWAY_ADMIN_USERNAME="test"
GATEWAY_ADMIN_PASSWORD="ignition"

# Account the Ignition service runs as. "root" is the proven default.
# "ignition" creates a dedicated unprivileged service account instead. NOTE: Ignition starts a
# non-root service through a login shell ('runuser -'), which drops the systemd Environment= values,
# so the module-acceptance variables are written into data/ignition.conf instead. Verify on the
# HMIP6 (gateway starts, MQTT module trusted) before using this in production.
GATEWAY_USER="root"

# Set to "true" to always remove and reinstall Ignition. By default an installation that is already
# the same version and runs as GATEWAY_USER is kept, and only the backup/modules are re-applied.
FORCE_REINSTALL="false"

# Perspective project the touchscreen opens at login, e.g.
#   perspective:http://localhost:8088/data/perspective/client/MyProject
# Leave empty to only install the Workstation and desktop shortcut.
WORKSTATION_URL=""
