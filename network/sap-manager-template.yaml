# Rendered by scripts/netcfg.py -> /etc/netplan/99-netcfg.yaml
network:
  version: 2
  renderer: NetworkManager

  ethernets:
    eno1:   # sap network
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: [ ]            # no IPv4 or IPv6 link-local addresses
      networkmanager:
        passthrough:
          ipv6.method: "disabled"          # IPv6 fully off on this port
          ipv4.ignore-auto-dns: "true"     # DNS "Automatic" switched off
          #ipv4.never-default: "true"       # "Use this connection only for resources on its network"
      addresses:
        - {{eno1_ip}}/24
