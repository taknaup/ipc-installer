# Rendered by scripts/netcfg.py -> /etc/netplan/99-netcfg.yaml
network:
  version: 2
  renderer: NetworkManager

  ethernets:
    eno1:   # sap network
      dhcp4: false
      addresses:
        - {{eno1_ip}}/24
      routes:
        - to: default
          via: 192.168.100.1
          metric: 100
