# Rendered by scripts/netcfg.py -> /etc/netplan/99-netcfg.yaml
network:
  version: 2
  renderer: NetworkManager

  ethernets:
    eno1:   # controls network
      dhcp4: false
      addresses:
        - {{eno1_ip}}/24
      routes:
        - to: 192.168.12.0/24
          via: 192.168.12.1
          table: 200
      routing-policy:
        - from: {{eno1_ip}}/32
          table: 200
          priority: 200

    enp2s0:   # sap network
      dhcp4: false
      addresses:
        - {{enp2s0_ip}}/24
      routes:
        - to: default
          via: 192.168.100.1
          metric: 100

    enp4s0:   # facility network
      dhcp4: false
      addresses:
        - {{enp4s0_ip}}/24
      routes:
        - to: default
          via: {{enp4s0_gateway}}
          table: 300
      routing-policy:
        - from: {{enp4s0_ip}}/32
          table: 300
          priority: 300
